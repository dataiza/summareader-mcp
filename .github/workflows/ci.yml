name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Tests
    runs-on: ubuntu-latest
    # Through env, because the `secrets` context is not available in a step's
    # `if` and an empty `token:` makes checkout fail rather than skip.
    env:
      APP_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The sibling checkout is what makes the protocol-vector test do
      # anything. Without it that test skips — and it is the one guarding
      # against this implementation and the app's drifting apart silently,
      # which is the whole reason the vectors file exists. Optional so a fork
      # with no token still runs everything else; the step below says out loud
      # when it is not there, rather than leaving a silent skip in a green run.
      - name: The app, for the protocol vectors
        id: app
        if: ${{ env.APP_TOKEN != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: dataiza/summareader
          path: .sibling/summareader
          token: ${{ env.APP_TOKEN }}

      - name: Say whether the vectors will be checked
        run: |
          if [ -f .sibling/summareader/docs/protocol-vectors.json ]; then
            echo "::notice::protocol vectors will be checked against the app"
          else
            echo "::warning::no APP_REPO_TOKEN, so the protocol-vector test \
          will skip — this implementation and the app's could drift apart and \
          this run would still be green"
          fi

      # uv, because uv.lock is committed and is what the versions here mean.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Test
        env:
          SUMMAREADER_VECTORS: .sibling/summareader/docs/protocol-vectors.json
        run: uv run --extra dev --quiet pytest -q

  console:
    name: Console
    runs-on: ubuntu-latest
    env:
      APP_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Same bargain as above, for the drift check. It compares this repo's
      # vendored copy of the app's design package against the original, and
      # skips without one — which is how ninety-one lines of it went unnoticed
      # until somebody looked by hand.
      - name: The app, for the vendored-look check
        id: app
        if: ${{ env.APP_TOKEN != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: dataiza/summareader
          path: .sibling/summareader
          token: ${{ env.APP_TOKEN }}

      - name: Say whether the look will be checked
        run: |
          if [ -d .sibling/summareader/packages/summareader_ui ]; then
            echo "::notice::the vendored look will be checked against the app"
          else
            echo "::warning::no APP_REPO_TOKEN, so the vendored-look check \
          will skip — the console can drift from the app one widget at a time \
          and this run would still be green"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Dependencies
        working-directory: console
        run: flutter pub get

      - name: Analyze
        working-directory: console
        run: flutter analyze

      - name: Formatting
        working-directory: console
        run: dart format --set-exit-if-changed lib test

      # Without the golden. That one compares pixels, and text rendering
      # differs between the machine that drew the picture and this one — the
      # screenshot is regenerated by whoever changes the window and reviewed in
      # the diff.
      - name: Test
        working-directory: console
        env:
          SUMMAREADER: ${{ github.workspace }}/.sibling/summareader
        run: flutter test --exclude-tags golden
