# An MCP server over your SummaReader library.
#
#   cp summareader-mcp.example.json summareader-mcp.local.json   # then fill it in
#   docker compose up -d
#
# Run it from this directory. The build context is this directory too: this
# server carries its own implementation of the sync protocol, checked against
# the app's test vectors, so it needs nothing outside its own repository.

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: summareader-mcp:local
    restart: unless-stopped

    ports:
      # Localhost only, and not negotiable without thinking hard first. This
      # port is unauthenticated and this process holds the master key, so
      # anything that can reach it can read the entire library in plaintext.
      # The encryption ends here — that is what this server is for, and why
      # it needs a boundary of its own.
      - "127.0.0.1:8100:8100"

    volumes:
      # The secrets, read-only, as a file rather than environment variables:
      # `docker inspect` prints an environment, and a mounted file can be
      # given permissions.
      - ./summareader-mcp.local.json:/config/summareader-mcp.json:ro
      # The decrypted cache. Deleting this volume costs nothing but a re-read
      # of the log.
      - mcp-cache:/cache

    healthcheck:
      # /health needs no token: it says whether the process is up and nothing
      # about what it holds, and a health check that needs a secret is one
      # that breaks the day the secret rotates.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    security_opt:
      - no-new-privileges:true

    # Reaching the sync server.
    #
    # host.docker.internal only works if the sync server is published on an
    # interface the container can reach — and its own compose binds it to
    # 127.0.0.1 on purpose, which the container cannot. So the answer for two
    # containers on one host is a shared network and the service name:
    #
    #   networks: [default, sync]
    #   ...and "server": "http://sync:8099" in the config file.
    #
    # This is left for the case that is actually common — a sync server
    # somewhere else entirely, reached by URL — and the host mapping is here
    # for when it genuinely is on this host and published.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      # Uncomment together with the block at the bottom of this file to reach
      # a sync server running in its own compose project on this host.
      # - sync

volumes:
  mcp-cache:

# networks:
#   sync:
#     external: true
#     # Whatever `docker network ls` calls the sync server's network — by
#     # default the project directory plus _default.
#     name: summareader-sync-server_default
