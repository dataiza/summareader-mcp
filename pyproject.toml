[project]
name = "summareader-mcp"
version = "0.4.5"
description = "A device that mirrors a SummaReader library and answers questions about it — over MCP, a terminal, or a command line."
requires-python = ">=3.11"
# The same licence the sync server carries. Declared here as well as shipped as
# a file, so `pip show` and every index answer the question without anyone
# having to open an archive.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    # The protocol. `cryptography` for HKDF-SHA256, PyNaCl for
    # XChaCha20-Poly1305 — libsodium's, so the AEAD is not hand-rolled.
    "cryptography>=42",
    "pynacl>=1.5",
    "httpx>=0.27",
    # The three front ends.
    "mcp>=1.2",
    "textual>=0.80",
]

[project.scripts]
summareader-mcp = "summareader_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# What is and is not Python here. The wheel is the package and nothing else;
# the sdist would otherwise sweep up console/, which is a Flutter application
# of its own — a hundred megabytes of build directory and a Dart lock file in
# a Python distribution, and pip would install none of it. It is built and
# shipped by `flutter build`, not by this.
[tool.hatch.build.targets.wheel]
packages = ["summareader_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["console", "docs", "build", "dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
