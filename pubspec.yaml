name: allreader_mcp
description: >-
  An MCP server that pairs with an AllReader sync server as a device, keeps a
  decrypted copy of the library, and answers questions about it.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # The protocol, shared with the app rather than reimplemented. Encryption
  # written twice is encryption that differs in one of the two.
  allreader_core:
    path: ../allreader/packages/allreader_core

  args: ^2.6.0
  mcp_dart: ^2.4.0
  sqlite3: ^3.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
